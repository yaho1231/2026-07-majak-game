<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — 노치·홈 인디케이터 영역까지 화면을 쓰고, 그 안쪽 여백은
         styles.css 가 env(safe-area-inset-*) 로 직접 잡는다. 이게 없으면 iOS 에서
         좌하단 빠른 토글이 홈 인디케이터 밑에 깔려 눌리지 않는다.
         maximum-scale·user-scalable 은 **일부러 넣지 않는다** — 확대 금지는 WCAG 1.4.4 위반이다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>이능마작 — 증강 리치마작</title>
    <!-- 공유된 링크가 이름 한 단어로만 보이지 않게 한다. 이 게임이 무엇인지는
         제목이 아니라 설명 줄에서 결정된다. -->
    <meta
      name="description"
      content="기존의 리치마작을 뒤바꾸는 다양한 증강을 즐겨보세요. 온라인 4인 일본 리치마작 + 증강 104종."
    />
    <meta name="theme-color" content="#0b1310" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="이능마작" />
    <meta property="og:title" content="이능마작 — 증강 리치마작" />
    <meta
      property="og:description"
      content="기존의 리치마작을 뒤바꾸는 다양한 증강을 즐겨보세요. 가입 없이 봇 3명과 바로 한 판."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="이능마작 — 증강 리치마작" />
    <meta
      name="twitter:description"
      content="기존의 리치마작을 뒤바꾸는 다양한 증강을 즐겨보세요. 가입 없이 봇 3명과 바로 한 판."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
