<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    이능마작 앱 아이콘.

    16px 파비콘에서도 읽혀야 하므로 형태를 둘로 줄였다: 세로로 선 **마작패**(상아)와
    그 얼굴의 **증강 불꽃**(보라). 마작이라는 것과 "그냥 마작이 아니라는 것"이
    한 눈에 들어오는 최소 조합이다.

    색은 앱 토큰 그대로다 — 펠트(--felt-0/3), 황동(--brass), 상아(--ink-1), 증강(--aug).
    PNG 파생본은 scripts/gen-brand-assets.sh 가 이 파일에서 만든다. 손으로 고치지 말 것.
  -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a21"/>
      <stop offset="1" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#ddd2b8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#6a45f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <rect x="7" y="7" width="498" height="498" rx="106" fill="none"
        stroke="#9a7b42" stroke-opacity="0.45" stroke-width="6"/>

  <!-- 패 — 아래쪽 어두운 띠가 두께로 읽힌다 -->
  <rect x="148" y="94" width="216" height="308" rx="32" fill="#6b6350"/>
  <rect x="148" y="94" width="216" height="292" rx="32" fill="url(#ivory)"/>

  <!-- 증강 불꽃 — 패 얼굴 정중앙(cx 256, cy 240), 바깥 반지름 100 -->
  <path d="M256 140 L285 211 L356 240 L285 269 L256 340 L227 269 L156 240 L227 211 Z"
        fill="url(#spark)"/>
  <circle cx="256" cy="240" r="21" fill="#0a1210" opacity="0.35"/>
  <circle cx="256" cy="240" r="14" fill="#d9cfff"/>
</svg>
