<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    안드로이드 maskable 아이콘. 런처가 이 그림을 원·둥근사각·물방울 등 **제 마음대로**
    잘라 낸다. 그래서 icon.svg 와 두 가지가 다르다:
      · 배경이 모서리까지 꽉 찬다(둥근 사각형이 아니다) — 잘려도 빈 구석이 안 생긴다.
      · 내용이 안전지대(중앙 지름 80% 원) 안에만 있다 — 어떻게 잘려도 패가 살아남는다.
    scripts/gen-brand-assets.sh 가 이 파일에서 icon-maskable-512.png 를 만든다.
  -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a21"/>
      <stop offset="1" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#ddd2b8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#6a45f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- 안전지대(반지름 205) 안에 들어가는 크기로 줄인 패 -->
  <rect x="181" y="146" width="150" height="214" rx="22" fill="#6b6350"/>
  <rect x="181" y="146" width="150" height="203" rx="22" fill="url(#ivory)"/>

  <path d="M256 178 L276 227 L325 247 L276 267 L256 316 L236 267 L187 247 L236 227 Z"
        fill="url(#spark)"/>
  <circle cx="256" cy="247" r="15" fill="#0a1210" opacity="0.35"/>
  <circle cx="256" cy="247" r="10" fill="#d9cfff"/>
</svg>
